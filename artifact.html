<title>Квиток</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="googlebot" content="noindex, nofollow">
<meta name="yandex" content="noindex, nofollow">
<script>
  // Не показывать страницу в поисковиках: метки переносим в <head>.
  ['robots', 'googlebot', 'yandex'].forEach(function (n) {
    var m = document.createElement('meta');
    m.name = n;
    m.content = 'noindex, nofollow, noarchive';
    document.head.appendChild(m);
  });
</script>
<meta name="description" content="Проверка квитанций ЖКХ по фото. Всё считается в браузере, фото никуда не отправляется.">
<style>
  :root { --bg: #f6fbf9; --fg: #0d3b30; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #10201b; --fg: #d4f5e9; color-scheme: dark } }
  :root[data-theme="dark"] { --bg: #10201b; --fg: #d4f5e9; color-scheme: dark }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--fg); }
  #kvitok-loading { display: grid; place-items: center; height: 100%; padding-inline: 16px; font: 16px/1.4 system-ui, sans-serif; text-align: center; }
</style>
<div id="kvitok-loading">Загружаем Квиток…<br>Фото будут обрабатываться в вашем браузере и никуда не отправятся.</div>
<script src="tess/tesseract.min.js"></script>
<script src="kvitok_ocr.js"></script>
<script>
  window.addEventListener('flutter-first-frame', function () {
    var el = document.getElementById('kvitok-loading');
    if (el) el.hidden = true;
  });
</script>
<script src="flutter_bootstrap.js" async></script>
